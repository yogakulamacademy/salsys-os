name: Knowledge Storage provider review
on:
  pull_request:
    branches: [main, feat/knowledge-import-upload-job-contract-20261127, fix/knowledge-provider-loopback-guard-20261127]
    paths:
      - 'docs/sql/knowledge-import-**'
      - 'tests/provider/knowledge-import-**'
      - 'lib/knowledge-import-**'
      - 'lib/knowledge-bulk-import-preflight.ts'
      - 'tests/readiness/knowledge-import-**'
      - 'tests/readiness/knowledge-bulk-import-preflight.test.cjs'
      - 'tests/performance/knowledge-import-capacity.test.cjs'
      - 'app/api/knowledge-import-review/**'
      - 'app/api/knowledge-import-worker/**'
      - 'scripts/self-host/cron-*.mjs'
      - 'tests/readiness/self-host-cron.behavior.test.mjs'
      - 'supabase/migrations/20261128043000_knowledge_import_gateway_bootstrap.sql'
      - '.github/workflows/knowledge-storage-provider-review.yml'
permissions:
  contents: read
concurrency:
  group: knowledge-storage-provider-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-storage:
    name: disposable-storage (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [gateway-only, rejected-direct-tus]
    env:
      SALSYS_ALLOW_DISPOSABLE_STORAGE_TEST: '1'
      SALSYS_STORAGE_REVIEW_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck cumulative application candidate
        run: npm run typecheck
      - name: Verify application route and scoped publication adapter
        run: node --test tests/readiness/knowledge-import-route-publication-review.test.cjs tests/readiness/knowledge-import-reconciliation-review.test.cjs tests/readiness/knowledge-import-publication-stream-review.test.cjs tests/readiness/knowledge-import-runtime-composition-review.test.cjs tests/readiness/knowledge-import-upload-flow-review.test.cjs tests/readiness/knowledge-import-worker-runtime-review.test.cjs tests/readiness/knowledge-import-worker-route.test.cjs tests/readiness/knowledge-import-server-auth-review.test.cjs
      - name: Verify loopback transport guard without network
        run: node --test tests/provider/knowledge-import-provider-transport.test.mjs
      - name: Install checksum-pinned local Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kb-provider-bin"
          curl --fail --silent --show-error --location --retry 2 -o "$RUNNER_TEMP/kb-provider-cli.tar.gz" https://github.com/supabase/cli/releases/download/v3.4.0/supabase_3.4.0_linux_amd64.tar.gz
          echo "d82f8fc8a1611c45b9422b10378f61df614325f7e25624acda3704544513d6ac  $RUNNER_TEMP/kb-provider-cli.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kb-provider-cli.tar.gz" -C "$RUNNER_TEMP/kb-provider-bin" supabase
          echo "$RUNNER_TEMP/kb-provider-bin" >> "$GITHUB_PATH"
      - name: Start fresh disposable local project (no repository migrations or remote link)
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
          export SUPABASE_HOME="$RUNNER_TEMP/kb-provider-home"
          mkdir -p "$RUNNER_TEMP/kb-provider-project" "$SUPABASE_HOME"
          cd "$RUNNER_TEMP/kb-provider-project"
          supabase --version
          supabase init --help >/dev/null
          supabase start --help >/dev/null
          supabase status --help >/dev/null
          supabase init > "$RUNNER_TEMP/kb-provider-init.log" 2>&1
          supabase start > "$RUNNER_TEMP/kb-provider-start.log" 2>&1
          umask 077
          supabase status -o json > "$RUNNER_TEMP/kb-provider-status.json"
          docker ps --format '{{.Names}} {{.Image}}' | grep -E 'storage|gotrue|auth' || true
      - name: Enable versioning in disposable gateway Storage
        if: matrix.mode == 'gateway-only'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          name = "supabase_storage_kb-provider-project"

          def docker(*args, stdin=None):
              return subprocess.run(["docker", *args], input=stdin, text=True,
                                    capture_output=True, check=True).stdout

          original = json.loads(docker("inspect", name))[0]
          image = original["Config"]["Image"]
          allowed_images = {
              "public.ecr.aws/supabase/storage-api:v1.98.8",
              "ghcr.io/supabase/storage-api:v1.98.8",
          }
          if image not in allowed_images or not original["State"]["Running"]:
              raise SystemExit("Unexpected disposable Storage container")
          config = original["Config"]
          config["Env"] = [v for v in config["Env"] if not v.startswith("STORAGE_VERSIONING_ENABLED=")]
          config["Env"].append("STORAGE_VERSIONING_ENABLED=true")
          config["Labels"] = {**(config["Labels"] or {}), "salsysos.disposable-versioning": "true"}
          config["HostConfig"] = original["HostConfig"]
          config["NetworkingConfig"] = {"EndpointsConfig": {
              network: {key: endpoint[key] for key in ("Aliases", "IPAMConfig") if endpoint.get(key)}
              for network, endpoint in original["NetworkSettings"]["Networks"].items()
          }}

          # Preserve the CLI-managed container so its normal teardown can still run.
          docker("stop", name)
          docker("rename", name, name + "-original")
          result = subprocess.run([
              "curl", "--fail", "--silent", "--unix-socket", "/var/run/docker.sock",
              "-H", "Content-Type: application/json", "--data-binary", "@-",
              "http://localhost/containers/create?name=" + name
          ], input=json.dumps(config), text=True, capture_output=True)
          if result.returncode:
              raise SystemExit("Could not create disposable versioned Storage container")
          docker("start", name)
          PY
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-all-errors \
            --retry-delay 2 --max-time 5 http://127.0.0.1:54321/storage/v1/status >/dev/null
      - name: Install Chromium for the signed-in gateway flow
        if: matrix.mode == 'gateway-only'
        run: npx playwright install --only-shell chromium
      - name: Verify selected architecture on its own fresh local Auth and Storage
        shell: bash
        env:
          SALSYS_LOCAL_STORAGE_STATUS_FILE: ${{ runner.temp }}/kb-provider-status.json
        run: node --test tests/provider/knowledge-import-storage-provider.test.mjs
      - name: Stop disposable stack
        if: always()
        shell: bash
        run: |
          storage_name=supabase_storage_kb-provider-project
          if docker inspect "$storage_name-original" >/dev/null 2>&1; then
            if [ "$(docker inspect --format '{{ index .Config.Labels "salsysos.disposable-versioning" }}' "$storage_name" 2>/dev/null)" = true ]; then
              docker rm -f "$storage_name" >/dev/null
            fi
            docker rename "$storage_name-original" "$storage_name"
          fi
          export SUPABASE_HOME="$RUNNER_TEMP/kb-provider-home"
          if [ -d "$RUNNER_TEMP/kb-provider-project" ]; then
            cd "$RUNNER_TEMP/kb-provider-project"
            supabase stop > "$RUNNER_TEMP/kb-provider-stop.log" 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/kb-provider-status.json"
