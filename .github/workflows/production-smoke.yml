name: Production Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/verify-production-smoke.mjs'
      - '.github/workflows/production-smoke.yml'
      - 'app/api/tracking/identify/route.ts'
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Production auth + release provenance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Verify production release and auth surfaces
        env:
          SALSYSOS_SMOKE_BASE_URL: https://crm.salsysos.com
          SALSYSOS_SMOKE_TIMEOUT_MS: '12000'
          SALSYSOS_SMOKE_ATTEMPTS: '3'
          SALSYSOS_EXPECTED_COMMIT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          SALSYSOS_SMOKE_DEPLOY_ATTEMPTS: '48'
          SALSYSOS_SMOKE_DEPLOY_INTERVAL_MS: '10000'
        run: node scripts/verify-production-smoke.mjs
