name: Authenticated Production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-production-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Authenticated production tenant smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Validate dedicated E2E secrets
        env:
          SALSYSOS_E2E_EMAIL: ${{ secrets.SALSYSOS_E2E_EMAIL }}
          SALSYSOS_E2E_PASSWORD: ${{ secrets.SALSYSOS_E2E_PASSWORD }}
          SALSYSOS_E2E_ORGANIZATION_ID: ${{ secrets.SALSYSOS_E2E_ORGANIZATION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SALSYSOS_E2E_EMAIL" || { echo "Missing SALSYSOS_E2E_EMAIL secret."; exit 1; }
          test -n "$SALSYSOS_E2E_PASSWORD" || { echo "Missing SALSYSOS_E2E_PASSWORD secret."; exit 1; }
          test -n "$SALSYSOS_E2E_ORGANIZATION_ID" || { echo "Missing SALSYSOS_E2E_ORGANIZATION_ID secret."; exit 1; }

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.51.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated production tenant session
        env:
          SALSYSOS_E2E_BASE_URL: https://crm.salsysos.com
          SALSYSOS_E2E_EMAIL: ${{ secrets.SALSYSOS_E2E_EMAIL }}
          SALSYSOS_E2E_PASSWORD: ${{ secrets.SALSYSOS_E2E_PASSWORD }}
          SALSYSOS_E2E_ORGANIZATION_ID: ${{ secrets.SALSYSOS_E2E_ORGANIZATION_ID }}
        run: >-
          npx playwright test scripts/verify-authenticated-production-e2e.spec.mjs
          --reporter=line
          --workers=1
