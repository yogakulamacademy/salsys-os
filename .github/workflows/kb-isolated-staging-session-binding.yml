name: KB Isolated Staging Auth-Bound Consent Acceptance

# KB-06H MANUAL ONLY. THIS WORKFLOW WRITES TWO TEST AUTH SESSION BINDINGS
# in a separately approved isolated staging database (and logs out sessions).
# Separate protected environment + independent approval required. This is NOT
# the existing read-only workflow. NO customer knowledge, consent grant, crawl,
# AI call, real website access, application data mutation or auto-schedule.
on:
  workflow_dispatch:
    inputs:
      staging_project_ref:
        description: "Exact dedicated isolated staging project ref (20 chars)"
        required: true
        type: string
      approval_phrase:
        description: "Type I_APPROVE_TWO_STAGING_TEST_SESSION_BINDINGS_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kb-isolated-staging-session-binding-acceptance
  cancel-in-progress: false

jobs:
  knowledge-negative-tests:
    name: Explicit session-binding writes then read-only consent checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Configure this environment with reviewers and restricted branches
    # BEFORE the workflow is first run.
    environment: kb-isolated-staging-session-binding-acceptance
    env:
      # Preflight still requires the original knowledge read-only acknowledgement,
      # PLUS the separate stronger explicit session-binding write approval below.
      SALSYS_KB_STAGING_RUN_APPROVAL: I_APPROVE_READ_ONLY_KB_STAGING
      SALSYS_KB_STAGING_BINDING_APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
      SALSYS_KB_STAGING_BINDING_WRITES_READY: ${{ vars.SALSYS_KB_STAGING_BINDING_WRITES_READY }}
      # Mandatory environment-scoped owner claims: missing env fails closed.
      SALSYS_KB_STAGING_ENVIRONMENT_READY: ${{ vars.SALSYS_KB_STAGING_ENVIRONMENT_READY }}
      SALSYS_KB_STAGING_APPROVED_COMMIT: ${{ vars.SALSYS_KB_STAGING_APPROVED_COMMIT }}
      SALSYS_KB_STAGING_REVIEWED_REF: ${{ vars.SALSYS_KB_STAGING_REVIEWED_REF }}
      SALSYS_KB_STAGING_GITHUB_SHA: ${{ github.sha }}
      SALSYS_KB_STAGING_GITHUB_REF: ${{ github.ref }}
      OPERATOR_STAGING_PROJECT_REF: ${{ inputs.staging_project_ref }}
      SALSYS_KB_STAGING_PROJECT_REF: ${{ vars.SALSYS_KB_STAGING_PROJECT_REF }}
      SALSYS_KB_STAGING_API_URL: ${{ vars.SALSYS_KB_STAGING_API_URL }}
      SALSYS_KB_STAGING_ANON_KEY: ${{ secrets.SALSYS_KB_STAGING_ANON_KEY }}
      SALSYS_KB_STAGING_A_EMAIL: ${{ secrets.SALSYS_KB_STAGING_A_EMAIL }}
      SALSYS_KB_STAGING_A_PASSWORD: ${{ secrets.SALSYS_KB_STAGING_A_PASSWORD }}
      SALSYS_KB_STAGING_A_USER_ID: ${{ vars.SALSYS_KB_STAGING_A_USER_ID }}
      SALSYS_KB_STAGING_A_ORG_ID: ${{ vars.SALSYS_KB_STAGING_A_ORG_ID }}
      SALSYS_KB_STAGING_A_DOCUMENT_ID: ${{ vars.SALSYS_KB_STAGING_A_DOCUMENT_ID }}
      SALSYS_KB_STAGING_A_MARKER: ${{ vars.SALSYS_KB_STAGING_A_MARKER }}
      SALSYS_KB_STAGING_B_EMAIL: ${{ secrets.SALSYS_KB_STAGING_B_EMAIL }}
      SALSYS_KB_STAGING_B_PASSWORD: ${{ secrets.SALSYS_KB_STAGING_B_PASSWORD }}
      SALSYS_KB_STAGING_B_USER_ID: ${{ vars.SALSYS_KB_STAGING_B_USER_ID }}
      SALSYS_KB_STAGING_B_ORG_ID: ${{ vars.SALSYS_KB_STAGING_B_ORG_ID }}
      SALSYS_KB_STAGING_B_DOCUMENT_ID: ${{ vars.SALSYS_KB_STAGING_B_DOCUMENT_ID }}
      SALSYS_KB_STAGING_B_MARKER: ${{ vars.SALSYS_KB_STAGING_B_MARKER }}

    steps:
      - name: Checkout exact reviewed code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Fail closed unless human confirmation matches configured staging
        shell: bash
        run: |
          set -euo pipefail
          test "$SALSYS_KB_STAGING_BINDING_APPROVAL_PHRASE" = "I_APPROVE_TWO_STAGING_TEST_SESSION_BINDINGS_ONLY" \
            || { echo "Explicit session binding write approval missing."; exit 1; }
          test "$SALSYS_KB_STAGING_BINDING_WRITES_READY" = "OWNER_APPROVED_ISOLATED_STAGING_SESSION_BINDING_WRITES" \
            || { echo "Protected environment has not authorized staging Auth binding writes."; exit 1; }
          test -n "$SALSYS_KB_STAGING_PROJECT_REF" \
            || { echo "Protected staging project ref is not configured."; exit 1; }
          test "$OPERATOR_STAGING_PROJECT_REF" = "$SALSYS_KB_STAGING_PROJECT_REF" \
            || { echo "Operator's staging project ref does not match protected environment."; exit 1; }

      - name: Verify reviewed commit, branch and project BEFORE login
        shell: bash
        run: |
          set -euo pipefail
          export SALSYS_KB_STAGING_CHECKOUT_SHA="$(git rev-parse HEAD)"
          node scripts/verify-kb-staging-workflow-attestation.mjs --check

      - name: Run offline tamper and target-preflight regression tests
        run: node --test tests/knowledge-extraction/kb-isolated-staging-readonly.test.mjs

      - name: Bind two new isolated-staging Auth sessions and verify consent authority
        shell: bash
        run: |
          set -euo pipefail
          export SALSYS_KB_STAGING_CHECKOUT_SHA="$(git rev-parse HEAD)"
          # KB-06H writes ONLY the existing tenant_session_bindings row for
          # each newly issued test Auth session; no consent/knowledge writes.
          node scripts/verify-kb-isolated-staging-readonly.mjs --run-bound-consent-actor
