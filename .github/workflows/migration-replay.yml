name: Migration Replay

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'scripts/build-migration-recovery-manifest.mjs'
      - '.github/workflows/migration-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build production-ledger recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-migration-recovery-manifest.mjs | tee migration-recovery-manifest-summary.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 3.0.0

      - name: Stage historical recovery prerequisites
        shell: bash
        run: |
          set -euo pipefail

          # Production records person_course_affinity as version 029. The course
          # capture variant was applied later as version 20261025130118, even
          # though the repository still carries the legacy 029 filename.
          mv supabase/migrations/029_course_capture_value_variants.sql \
             supabase/migrations/20261025130118_029_course_capture_value_variants.sql

          # Production records numeric 030 as lead_sales_intelligence. Trusted
          # business-event contact resolution was applied later at 20261025131249.
          mv supabase/migrations/030_trusted_business_event_contact_resolution.sql \
             supabase/migrations/20261025131249_trusted_business_event_contact_resolution.sql

          cp supabase/recovery/007_catalog_authorization_prerequisite.sql supabase/migrations/0065_recovery_catalog_authorization.sql
          cp supabase/recovery/016_enrollments_tenant_baseline.sql supabase/migrations/0154_recovery_enrollments_tenant.sql
          cp supabase/recovery/016_lead_contact_logs_baseline.sql supabase/migrations/0155_recovery_lead_contact_logs.sql
          cp supabase/recovery/016_journey_views_baseline.sql supabase/migrations/0156_recovery_journey_views.sql
          cp supabase/recovery/017_payments_tenant_baseline.sql supabase/migrations/0165_recovery_payments_tenant.sql
          cp supabase/recovery/018_person_journey_source_baseline.sql supabase/migrations/0175_recovery_person_journey_source.sql
          cp supabase/recovery/019_leads_workspace_baseline.sql supabase/migrations/0185_recovery_leads_workspace.sql
          cp supabase/recovery/020_attribution_views_baseline.sql supabase/migrations/0195_recovery_attribution_views.sql
          cp supabase/recovery/023_integration_connections_baseline.sql supabase/migrations/0225_recovery_integration_connections.sql
          cp supabase/recovery/030_followups_tenant_baseline.sql supabase/migrations/0295_recovery_followups_tenant.sql
          cp supabase/recovery/030_lead_geo_baseline.sql supabase/migrations/0296_recovery_lead_geo.sql
          cp supabase/recovery/030_sales_read_models_baseline.sql supabase/migrations/0297_recovery_sales_read_models.sql
          cp supabase/recovery/032_integration_assets_baseline.sql supabase/migrations/0315_recovery_integration_assets.sql
          cp supabase/recovery/039_analytics_seo_warehouse_baseline.sql supabase/migrations/0385_recovery_analytics_seo_warehouse.sql
          cp supabase/recovery/039_leads_landing_page_baseline.sql supabase/migrations/0386_recovery_leads_landing_page.sql
          cp supabase/recovery/040_paid_media_warehouse_baseline.sql supabase/migrations/0395_recovery_paid_media_warehouse.sql
          cp supabase/recovery/040_campaigns_read_models_baseline.sql supabase/migrations/0396_recovery_campaigns_read_models.sql
          cp supabase/recovery/042_paid_media_overview_prerequisite.sql supabase/migrations/0415_recovery_paid_media_overview.sql
          cp supabase/recovery/047_integration_oauth_states_prerequisite.sql supabase/migrations/0465_recovery_integration_oauth_states.sql

          # The tenant-aware Team Performance and Assignment Fairness RPCs were
          # applied out-of-band before the Reports workspace authorization
          # migration. The exact historical definitions were recovered from the
          # October audit snapshot and stored compressed to avoid transcription
          # drift. Decode them at their pre-authorization point in CI only.
          base64 -d supabase/recovery/20261013125000_reports_rpc_prerequisite.sql.gz.b64 \
            | gzip -d \
            > supabase/migrations/20261013125000_reports_rpc_prerequisite.sql

          # The original tracking-source migration exists in production history
          # but was never committed to Git. Stage the minimal authoritative
          # prerequisite at its real production ledger version for clean replay.
          cp supabase/recovery/20261017155803_tracking_sources_core_prerequisite.sql \
             supabase/migrations/20261017155803_tracking_sources_and_event_contracts_v1.sql

      - name: Start local Supabase database
        shell: bash
        run: |
          set -o pipefail
          supabase db start 2>&1 | tee migration-replay.log

      - name: Replay migrations from a clean database
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local 2>&1 | tee -a migration-replay.log

      - name: Show local migration state
        if: always()
        shell: bash
        run: |
          supabase migration list --local 2>&1 | tee -a migration-replay.log || true

      - name: Upload migration recovery evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: migration-recovery-evidence
          path: |
            migration-recovery-manifest.md
            migration-recovery-manifest-summary.json
            migration-replay.log
          if-no-files-found: ignore
          retention-days: 3
