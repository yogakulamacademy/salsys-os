# Temporary, no-credential generator to obtain the migration filename from
# the pinned Supabase CLI (never guess a timestamp). The final migration review
# PR removes this temporary workflow before merging. No hosted DB commands.
name: R2 stage-only migration CLI filename (no database access)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r2-stage-only-cli-filename-review.yml'
permissions:
  contents: read
jobs:
  cli-filename:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 3.0.0
      - name: Create versioned filename with CLI only in disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/r2-stage-migration-name"
          mkdir -p "$root"
          cd "$root"
          supabase --version
          supabase migration new --help
          supabase init --yes
          supabase migration new r2_staging_privileged_function_grants_v1
          mapfile -t generated < <(find supabase/migrations -maxdepth 1 -type f -name '*_r2_staging_privileged_function_grants_v1.sql' -print)
          test "${#generated[@]}" -eq 1
          test ! -s "${generated[0]}"
          echo "CLI_GENERATED_R2_FILENAME=$(basename "${generated[0]}")"
          echo "No database URL, provider credential, database connection, migration application, repository write, or deployment used."
