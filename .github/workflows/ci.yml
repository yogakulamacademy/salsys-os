name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_USE_MOCK_DATA: 'true'
      # Non-secret placeholders let Next.js reach the cookies()-based dynamic
      # route boundary during build analysis without connecting to production.
      NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'ci-placeholder-key'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Universal Tracking Intelligence SDK
        run: npm run verify:tracking-sdk

      - name: Verify Tracking Live Closeout Contracts
        run: npm run verify:tracking-live-closeout

      - name: Verify Durable Event Ingestion Contracts
        run: npm run verify:durable-event-ingestion

      - name: Verify Universal Platform SDK Contracts
        run: npm run verify:universal-platform-sdk

      - name: Verify Web Platform Adapter Contracts
        run: npm run verify:web-platform-adapters

      - name: Verify WordPress Adapter Contracts
        run: npm run verify:wordpress-adapter

      - name: Verify Tracking Source Management UI
        run: npm run verify:tracking-source-ui

      - name: Verify Intelligence Accuracy Contracts
        run: npm run verify:intelligence-accuracy

      - name: Verify Prediction Freshness Contracts
        run: npm run verify:intelligence-freshness

      - name: Verify Prediction Calibration Contracts
        run: npm run verify:intelligence-calibration

      - name: Verify Commercial Intelligence Contracts
        run: npm run verify:commercial-intelligence

      - name: Verify WhatsApp Operations Contracts
        run: npm run verify:whatsapp-operations

      - name: Verify WhatsApp Broadcast Runner Contracts
        run: npm run verify:whatsapp-broadcast-runner

      - name: Verify WhatsApp Growth Contracts
        run: npm run verify:whatsapp-growth

      - name: Verify Instagram Operations Contracts
        run: npm run verify:instagram-operations

      - name: Verify CRM Core Closeout Contracts
        run: npm run verify:crm-core

      - name: Verify Customer 360 Identity Closeout Contracts
        run: npm run verify:customer360-identity

      - name: Verify Onboarding Foundation Contracts
        run: npm run verify:onboarding-foundation

      - name: Verify Authenticated Production E2E Contract
        run: npm run verify:authenticated-production-e2e-contract

      - name: Verify Analytics Sync Body Limits
        run: npm run verify:analytics-sync-body-limits

      - name: Verify Baseline Browser Security Headers
        run: npm run verify:baseline-security-headers

      - name: Verify OAuth Connect Fetch Metadata
        run: npm run verify:oauth-connect-fetch-metadata

      - name: Verify Client/Server Secret Boundary
        run: npm run verify:client-secret-boundary

      - name: Verify Provider Visibility Single RPC
        run: npm run verify:provider-visibility-single-rpc

      - name: Verify Conversations Single RPC
        run: npm run verify:conversations-single-rpc

      - name: Verify Person Journey Single RPC
        run: npm run verify:person-journey-single-rpc

      - name: Verify WhatsApp Canonical Health Sync
        run: npm run verify:whatsapp-health-canonical-sync

      - name: Verify CRM Core Health V2
        run: npm run verify:crm-core-health-v2

      - name: Verify Customer 360 Health V2
        run: npm run verify:customer360-health-v2

      - name: Verify System Integrity Health V1
        run: npm run verify:system-integrity-health-v1

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 3
