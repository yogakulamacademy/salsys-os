name: CI

on:
  pull_request:
    branches:
      - main
      # Temporary Knowledge Builder stacked draft validation only.
      - feature/kb06a-discovery-explicit-consent-gate
      - feature/kb06b-audited-consent-lifecycle
      - feature/kb06c-revoked-metadata-erasure
      - feature/kb06d-owner-consent-review-ui
      - feature/kb06e-verified-policy-document-preview
      - feature/kb06f-staging-consent-actor-readonly
      - feature/kb06g-retention-deletion-dependency-inventory
      - feature/kb06h-isolated-staging-session-bind-handshake
      - feature/kb07c-approval-audit-delete-guard-draft
  push:
    branches:
      - main
      - feature/kb06a-discovery-explicit-consent-gate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fixture-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SALSYS_ALLOW_LOCAL_DB_TESTS: '1'
      SALSYS_TEST_DATABASE_URL: 'postgres://postgres:local-fixture-only@127.0.0.1:55432/postgres'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify independent-session refund races and rollback fixture
        run: npm run test:financial:db

      - name: Verify KB-01C discovery schema and leases in disposable PostgreSQL
        run: node --test tests/database/knowledge-discovery-ledger.test.mjs

      - name: Verify KB-01D synthetic website end-to-end against disposable PostgreSQL
        run: node --experimental-strip-types --test tests/database/knowledge-discovery-e2e.test.mjs

      - name: Verify consent withdrawal rejects discovery leases and late commits in disposable PostgreSQL
        run: node --test tests/database/knowledge-discovery-consent.test.mjs

      - name: Verify signed-session consent, withdrawal and metadata erasure on disposable PostgreSQL
        run: node --test tests/database/knowledge-discovery-consent-lifecycle.test.mjs

      - name: Verify KB-07C approval audit deletion guard on disposable PostgreSQL
        run: node --test tests/database/knowledge-approval-audit-delete-guard.test.mjs

      - name: Verify exact Instagram outbound projector SQL in isolated PostgreSQL
        run: node --test tests/database/instagram-outbound-echo-projector.test.mjs

      - name: Verify concurrent Instagram echo idempotency across independent PostgreSQL transactions
        run: node --test tests/database/instagram-outbound-echo-concurrency.test.mjs

  validate:
    # Pin the tested runner image: ubuntu-latest resolved to resolute and
    # apt font downloads stalled the browser setup until the job was cancelled.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_USE_MOCK_DATA: 'true'
      # Non-secret placeholders let Next.js reach the cookies()-based dynamic
      # route boundary during build analysis without connecting to production.
      NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'ci-placeholder-key'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Universal Tracking Intelligence SDK
        run: npm run verify:tracking-sdk

      - name: Verify R2 optional-consent audit is read-only and privacy-safe
        run: node --test tests/readiness/r2-optional-consent-metadata-audit-v1.test.cjs

      - name: Verify Tracking Live Closeout Contracts
        run: npm run verify:tracking-live-closeout

      - name: Verify Tracking & Data Final Closeout Contracts
        run: npm run verify:tracking-data-final-closeout

      - name: Verify Durable Event Ingestion Contracts
        run: npm run verify:durable-event-ingestion

      - name: Verify Universal Platform SDK Contracts
        run: npm run verify:universal-platform-sdk

      - name: Verify Web Platform Adapter Contracts
        run: npm run verify:web-platform-adapters

      - name: Verify WordPress Adapter Contracts
        run: npm run verify:wordpress-adapter

      - name: Verify Tracking Source Management UI
        run: npm run verify:tracking-source-ui

      - name: Verify Intelligence Accuracy Contracts
        run: npm run verify:intelligence-accuracy

      - name: Verify Prediction Freshness Contracts
        run: npm run verify:intelligence-freshness

      - name: Verify Prediction Calibration Contracts
        run: npm run verify:intelligence-calibration

      - name: Verify Commercial Intelligence Contracts
        run: npm run verify:commercial-intelligence

      - name: Verify Cross-Workspace Investigation Scope Contracts
        run: npm run verify:investigation-scope

      - name: Verify WhatsApp Operations Contracts
        run: npm run verify:whatsapp-operations

      - name: Verify WhatsApp Broadcast Runner Contracts
        run: npm run verify:whatsapp-broadcast-runner

      - name: Verify WhatsApp Growth Contracts
        run: npm run verify:whatsapp-growth

      - name: Verify WhatsApp Final Closeout Contracts
        run: npm run verify:whatsapp-final-closeout

      - name: Verify Instagram Operations Contracts
        run: npm run verify:instagram-operations

      - name: Verify CRM Core Closeout Contracts
        run: npm run verify:crm-core

      - name: Verify Customer 360 Identity Closeout Contracts
        run: npm run verify:customer360-identity

      - name: Verify CRM + Customer 360 Final Closeout Contracts
        run: npm run verify:crm-customer360-final-closeout

      - name: Verify PA-1 Human-Approved Identity Merge Contracts
        run: npm run verify:human-approved-identity-merge-v1

      - name: Verify Admissions Final Closeout Contracts
        run: npm run verify:admissions-final-closeout

      - name: Verify Performance Final Closeout Contracts
        run: npm run verify:performance-final-closeout

      - name: Verify Automation Final Closeout Contracts
        run: npm run verify:automation-final-closeout

      - name: Verify Operations Final Closeout Contracts
        run: npm run verify:operations-final-closeout

      - name: Verify Settings Final Closeout Contracts
        run: npm run verify:settings-final-closeout

      - name: Verify AI Knowledge Final Closeout Contracts
        run: npm run verify:ai-knowledge-final-closeout

      - name: Verify KB-01 website discovery safety tests
        run: node --experimental-strip-types --test tests/knowledge-discovery/*.test.mjs

      - name: Verify KB-02+ website evidence and Knowledge Builder safety tests
        run: node --experimental-strip-types --test tests/knowledge-extraction/*.test.mjs

      - name: Verify Home Command Center Final Closeout Contracts
        run: npm run verify:home-command-center-final-closeout

      - name: Verify Conversations Final Closeout Contracts
        run: npm run verify:conversations-final-closeout

      - name: Verify Onboarding Foundation Contracts
        run: npm run verify:onboarding-foundation

      - name: Verify Platform Onboarding Final Closeout Contracts
        run: npm run verify:platform-onboarding-final-closeout

      - name: Verify Authenticated Production E2E Contract
        run: npm run verify:authenticated-production-e2e-contract

      - name: Verify Analytics Sync Body Limits
        run: npm run verify:analytics-sync-body-limits

      - name: Verify Baseline Browser Security Headers
        run: npm run verify:baseline-security-headers

      - name: Verify OAuth Connect Fetch Metadata
        run: npm run verify:oauth-connect-fetch-metadata

      - name: Verify Client/Server Secret Boundary
        run: npm run verify:client-secret-boundary

      - name: Verify Provider Visibility Single RPC
        run: npm run verify:provider-visibility-single-rpc

      - name: Verify Conversations Single RPC
        run: npm run verify:conversations-single-rpc

      - name: Verify Person Journey Single RPC
        run: npm run verify:person-journey-single-rpc

      - name: Verify WhatsApp Canonical Health Sync
        run: npm run verify:whatsapp-health-canonical-sync

      - name: Verify CRM Core Health V2
        run: npm run verify:crm-core-health-v2

      - name: Verify Customer 360 Health V2
        run: npm run verify:customer360-health-v2

      - name: Verify System Integrity Health V1
        run: npm run verify:system-integrity-health-v1

      - name: Verify System Health Integrity UI
        run: npm run verify:system-health-integrity-ui

      - name: Verify System Health Final Closeout Contracts
        run: npm run verify:system-health-final-closeout

      - name: Verify Meta Ads Operational Health V1
        run: npm run verify:meta-ads-operational-health-v1

      - name: Verify Admissions Cron Registration
        run: npm run verify:admissions-cron-registration

      - name: Verify Admissions Rule Key Ambiguity
        run: npm run verify:admissions-rule-key-ambiguity

      - name: Verify Browser Form Discovery Dedupe
        run: npm run verify:browser-form-discovery-dedupe

      - name: Verify PH-3 Operational Readiness Closeout
        run: npm run verify:ph3-operational-readiness-closeout

      - name: Verify PH-5 Recovery Readiness Contract
        run: npm run verify:recovery-readiness

      - name: Verify Ad Activation Foundation Contracts
        run: npm run verify:ad-activation-foundation

      - name: Verify Ad Activation CRM Mapping Contracts
        run: npm run verify:ad-activation-crm-mapping

      - name: Verify Ad Activation Membership Writer Contracts
        run: npm run verify:ad-activation-writer

      - name: Verify Ad Activation Claim and Pre-Send Guard Contracts
        run: npm run verify:ad-activation-delivery-guard

      - name: Verify Ad Activation Delivery Finalization Contracts
        run: npm run verify:ad-activation-delivery-finalize

      - name: Verify Ad Activation Provider Dry-Run Contracts
        run: npm run verify:ad-activation-provider-dryrun

      - name: Verify Ad Activation Provider Readiness Contracts
        run: npm run verify:ad-activation-provider-readiness

      - name: Verify Ad Activation Credential and Transport Boundary Contracts
        run: npm run verify:ad-activation-transport-boundary

      - name: Verify Ad Activation Execution Readiness Contracts
        run: npm run verify:ad-activation-execution-readiness

      - name: Verify Ad Activation Meta Transport Contracts
        run: npm run verify:ad-activation-meta-transport

      - name: Verify Ad Activation Execution Runner Contracts
        run: npm run verify:ad-activation-execution-runner

      - name: Verify Ad Activation Runner Operational Controls
        run: npm run verify:ad-activation-runner-operations

      - name: Verify Ad Activation Canary Boundary
        run: npm run verify:ad-activation-canary-boundary

      - name: Typecheck
        run: npm run typecheck

      - name: Verify presentation and secure contact failure states
        run: npm run test:ui:unit

      - name: Verify enquiry journey evidence and privacy projection
        run: npm run test:journey

      - name: Verify knowledge grounding and financial input boundaries
        run: npm run test:readiness

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Install local UI browser
        # GitHub's pinned Ubuntu runner supplies shared runtime libraries;
        # avoid distro-wide apt font installation, which stalled CI.
        timeout-minutes: 4
        run: npx playwright install --only-shell chromium

      - name: Verify UI with synthetic loopback services
        run: npm run test:ui

      - name: Verify knowledge preview with synthetic live-mode services
        run: npm run test:knowledge:ui

      - name: Verify refund controls with synthetic live-mode services
        run: npm run test:financial:ui

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ui-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 3
